<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROLIV PHYSIO</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --red-accent: #d32f2f;
            --accent-green: #00e676;
            --accent-orange: #ff9800;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 12px;
            padding-bottom: 90px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 16px 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ff5252, #d32f2f);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 0 10px rgba(211, 47, 47, 0.5);
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .top-icons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .top-icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* Dashboard Overview Grid */
        .grid-boxes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .box-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 100px;
            border: 1px solid #2a2a2c;
            cursor: pointer;
        }

        .pill-badge {
            background-color: #5f1414;
            color: #ff8a80;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 6px;
        }

        .pill-badge.green {
            background-color: #0d381e;
            color: #00e676;
        }

        /* Section Header */
        .section-header {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin: 18px 4px 10px 4px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* One by One Patient Card (Manage Members Style) */
        .member-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #2a2a2c;
            position: relative;
        }

        .member-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .member-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #2c2c2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff8a80;
            border: 1px solid #3a3a3c;
        }

        .member-details {
            flex: 1;
        }

        .member-name {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .member-sub {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .member-phone {
            font-size: 0.85rem;
            color: #29b6f6;
            margin-top: 2px;
            font-weight: 600;
        }

        .member-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.78rem;
            background: #161618;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .mg-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .mg-label {
            color: var(--text-sub);
            font-size: 0.68rem;
        }

        .mg-val {
            font-weight: bold;
            color: var(--text-main);
        }

        /* Bottom Actions Bar on Card */
        .member-actions {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #2c2c2e;
            padding-top: 10px;
        }

        .action-icon-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.7rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        .action-icon-btn span {
            font-size: 0.9rem;
        }

        /* Floating Action Button (FAB) */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--red-accent);
            color: #ffffff;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(213, 47, 47, 0.5);
            cursor: pointer;
            border: none;
            z-index: 99;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            border-top: 1px solid #3a3a3c;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            color: #fff;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .btn-full {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-save { background: var(--red-accent); color: #fff; }
        .btn-cancel { background: #3a3a3c; color: #fff; }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2c2c2e;
            font-size: 0.85rem;
        }
        .detail-label { color: var(--text-sub); }
        .detail-val { font-weight: bold; color: var(--text-main); }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="brand">
            <div class="brand-logo">P</div>
            <div class="brand-title">PROLIV PHYSIO</div>
        </div>
        <div class="top-icons">
            <button class="top-icon-btn" onclick="openPatientModal()">👤+</button>
            <button class="top-icon-btn" onclick="openPnlModal()">📈</button>
        </div>
    </div>

    <!-- Dashboard Overview Grid -->
    <div class="grid-boxes">
        <div class="box-card" onclick="openPnlModal()">
            <div style="font-size:1.2rem;">💰</div>
            <div style="font-size:0.7rem; color:#aaa; margin:4px 0;">Collection</div>
            <div class="pill-badge green" id="dash-collection">₹0</div>
        </div>
        <div class="box-card" onclick="openPnlModal()">
            <div style="font-size:1.2rem;">💸</div>
            <div style="font-size:0.7rem; color:#aaa; margin:4px 0;">Expense</div>
            <div class="pill-badge" id="dash-expense">₹0</div>
        </div>
        <div class="box-card" onclick="openPnlModal()">
            <div style="font-size:1.2rem;">👛</div>
            <div style="font-size:0.7rem; color:#aaa; margin:4px 0;">Due Amount</div>
            <div class="pill-badge" id="dash-due">₹0</div>
        </div>
    </div>

    <!-- PATIENTS LIST (One by One / Manage Members Layout) -->
    <div class="section-header">
        <span>PATIENTS LIST</span>
        <button style="background:#3a3a3c; color:#fff; border:none; padding:4px 8px; border-radius:6px; font-size:0.75rem;" onclick="openPatientModal()">+ Add Patient</button>
    </div>
    
    <div id="patient-list-container"></div>

    <!-- Floating Action Button -->
    <button class="fab" onclick="openPatientModal()">+</button>

    <!-- Modal Popup -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">Edit Details</div>
            <div id="modal-body"></div>
            <div class="modal-actions" id="modal-actions">
                <button class="btn-full btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-full btn-save" onclick="saveData()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let patients = JSON.parse(localStorage.getItem('proliv_patients')) || [
            { name: "Shyamjith", phone: "9496342522", plan: "Couple Pack", finalAmt: 3500, paid: 3500, due: 0, startDate: "Oct 27, 2026", endDate: "Jan 24, 2027", status: "Active" },
            { name: "Fathima hannath", phone: "6282944060", plan: "Basic Pack", finalAmt: 2000, paid: 2000, due: 0, startDate: "Oct 27, 2026", endDate: "Nov 25, 2026", status: "Active" }
        ];

        let transactions = JSON.parse(localStorage.getItem('proliv_transactions')) || [
            { name: "Fathima hannath", type: "Income", amount: 2000, date: "Oct 27, 2026" },
            { name: "Shyamjith", type: "Income", amount: 3500, date: "Oct 27, 2026" }
        ];

        let currentType = '';
        let editIndex = -1;

        function updateUI() {
            let totalIncome = transactions.filter(t => t.type === 'Income').reduce((a, b) => a + Number(b.amount), 0);
            let totalExpense = transactions.filter(t => t.type === 'Expense').reduce((a, b) => a + Number(b.amount), 0);
            let totalDue = patients.reduce((a, b) => a + Number(b.due || 0), 0);

            document.getElementById('dash-collection').innerText = '₹' + totalIncome;
            document.getElementById('dash-expense').innerText = '₹' + totalExpense;
            document.getElementById('dash-due').innerText = '₹' + totalDue;

            // Render One-by-One Patient Cards
            let pContainer = document.getElementById('patient-list-container');
            pContainer.innerHTML = patients.length === 0 ? '<div style="text-align:center; color:#666; padding:20px;">No Patients Added</div>' :
                patients.map((p, i) => `
                <div class="member-card">
                    <div class="member-header">
                        <div class="member-avatar">${p.name.charAt(0)}</div>
                        <div class="member-details">
                            <div class="member-name">${p.name}</div>
                            <div class="member-sub">Address / Location</div>
                            <div class="member-phone">${p.phone || 'No Number'}</div>
                        </div>
                    </div>
                    <div class="member-grid">
                        <div class="mg-item">
                            <span class="mg-label">Join Date</span>
                            <span class="mg-val">${p.startDate || 'Oct 27, 2026'}</span>
                        </div>
                        <div class="mg-item">
                            <span class="mg-label">End Date</span>
                            <span class="mg-val">${p.endDate || 'Nov 27, 2026'}</span>
                        </div>
                        <div class="mg-item">
                            <span class="mg-label">Plan</span>
                            <span class="mg-val">${p.plan || 'Therapy'}</span>
                        </div>
                        <div class="mg-item">
                            <span class="mg-label">Final Amt</span>
                            <span class="mg-val">₹${p.finalAmt || 0}</span>
                        </div>
                        <div class="mg-item">
                            <span class="mg-label">Paid Amt</span>
                            <span class="mg-val" style="color:#00e676">₹${p.paid || 0}</span>
                        </div>
                        <div class="mg-item">
                            <span class="mg-label">Due</span>
                            <span class="mg-val" style="color:${p.due > 0 ? '#ef5350' : '#00e676'}">₹${p.due || 0}</span>
                        </div>
                    </div>
                    <div class="member-actions">
                        <button class="action-icon-btn" onclick="viewPatientCard(${i})"><span>👤</span>Profile</button>
                        <button class="action-icon-btn" onclick="openPatientModal(${i})"><span>✏️</span>Edit</button>
                        <button class="action-icon-btn" onclick="deletePatient(${i})" style="color:#ef5350;"><span>❌</span>Delete</button>
                    </div>
                </div>`).join('');

            localStorage.setItem('proliv_patients', JSON.stringify(patients));
            localStorage.setItem('proliv_transactions', JSON.stringify(transactions));
        }

        function viewPatientCard(index) {
            let p = patients[index];
            document.getElementById('modal-title').innerText = p.name + " Profile";
            document.getElementById('modal-body').innerHTML = `
                <div class="detail-row"><span class="detail-label">Phone:</span><span class="detail-val">${p.phone}</span></div>
                <div class="detail-row"><span class="detail-label">Plan:</span><span class="detail-val">${p.plan}</span></div>
                <div class="detail-row"><span class="detail-label">Final Amount:</span><span class="detail-val">₹${p.finalAmt}</span></div>
                <div class="detail-row"><span class="detail-label">Paid:</span><span class="detail-val" style="color:#00e676">₹${p.paid}</span></div>
                <div class="detail-row"><span class="detail-label">Due:</span><span class="detail-val" style="color:#ef5350">₹${p.due}</span></div>
            `;
            document.getElementById('modal-actions').innerHTML = `<button class="btn-full btn-cancel" onclick="closeModal()">Close</button>`;
            document.getElementById('modal').style.display = 'flex';
        }

        function openPnlModal() {
            let totalInc = transactions.filter(t => t.type === 'Income').reduce((a, b) => a + Number(b.amount), 0);
            let totalExp = transactions.filter(t => t.type === 'Expense').reduce((a, b) => a + Number(b.amount), 0);
            let netProfit = totalInc - totalExp;

            document.getElementById('modal-title').innerText = "P&L Report";
            document.getElementById('modal-body').innerHTML = `
                <div style="text-align:center; margin-bottom:12px;">
                    <div style="font-size:0.8rem; color:#aaa;">Net Profit: <b style="color:#fff;">₹${netProfit}</b> Total</div>
                    <div style="font-size:0.75rem; color:#888; margin-top:2px;">Collection: ₹${totalInc} | Expense: ₹${totalExp}</div>
                </div>
                ${transactions.map(t => `
                    <div class="detail-row">
                        <span style="color:#888;">${t.date || 'Oct 28, 2026'}</span>
                        <span style="font-weight:bold;">${t.name}</span>
                        <span style="color:#00e676">+₹${t.amount}</span>
                    </div>
                `).join('')}
            `;
            document.getElementById('modal-actions').innerHTML = `<button class="btn-full btn-cancel" onclick="closeModal()">Close</button>`;
            document.getElementById('modal').style.display = 'flex';
        }

        function openPatientModal(index = -1) {
            currentType = 'patient';
            editIndex = index;
            let data = index >= 0 ? patients[index] : { name: '', phone: '', plan: '', finalAmt: '', paid: '', due: '' };

            document.getElementById('modal-title').innerText = index >= 0 ? 'Edit Patient' : 'Add New Patient';
            document.getElementById('modal-body').innerHTML = `
                <div class="form-group"><label>Patient Name</label><input id="p_name" value="${data.name}"></div>
                <div class="form-group"><label>Contact Number</label><input id="p_phone" value="${data.phone}"></div>
                <div class="form-group"><label>Plan / Condition</label><input id="p_plan" value="${data.plan}"></div>
                <div class="form-group"><label>Final Amount (₹)</label><input type="number" id="p_amt" value="${data.finalAmt}"></div>
                <div class="form-group"><label>Paid Amount (₹)</label><input type="number" id="p_paid" value="${data.paid}"></div>
                <div class="form-group"><label>Due Amount (₹)</label><input type="number" id="p_due" value="${data.due}"></div>
            `;
            document.getElementById('modal-actions').innerHTML = `
                <button class="btn-full btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-full btn-save" onclick="saveData()">Save</button>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function saveData() {
            let obj = {
                name: document.getElementById('p_name').value,
                phone: document.getElementById('p_phone').value,
                plan: document.getElementById('p_plan').value,
                finalAmt: Number(document.getElementById('p_amt').value),
                paid: Number(document.getElementById('p_paid').value),
                due: Number(document.getElementById('p_due').value),
                startDate: "Oct 29, 2026",
                endDate: "Nov 29, 2026"
            };
            if (editIndex >= 0) patients[editIndex] = obj; else {
                patients.unshift(obj);
                transactions.unshift({ name: obj.name, type: 'Income', amount: obj.paid, date: "Oct 29, 2026" });
            }
            closeModal();
            updateUI();
        }

        function deletePatient(i) {
            if(confirm("ഈ പേഷ്യന്റിനെ ഡിലീറ്റ് ചെയ്യണമെന്നുറപ്പാണോ?")) {
                patients.splice(i, 1);
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
