<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proliv Physio Management</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1c1c1e;
      --border-color: #333;
      --accent-red: #d32f2f;
      --accent-green: #4caf50;
      --text-main: #ffffff;
      --text-muted: #aaa;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: transform .15s ease, border-color .15s ease;
    }
    .card:active {
      transform: scale(0.96);
      border-color: var(--accent-red);
    }
    .card-icon { font-size: 24px; margin-bottom: 6px; }
    .card-label { font-size: 13px; font-weight: 600; color: #ddd; }
    .pill-badge {
      display: inline-block;
      background: var(--accent-red);
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 6px;
    }
    .pill-badge.green { background: var(--accent-green); }
    .pill-badge.dark { background: #444; }

    /* Top Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
    }
    .stat-card:active { transform: scale(0.97); }
    .stat-card small { color: var(--text-muted); font-size: 11px; }
    .stat-card div:last-child { font-size: 16px; font-weight: bold; margin-top: 4px; }

    .section-box {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin: 14px 0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
    }
    .section-header {
      margin: 12px 0;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
    }
    .section-home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      margin-bottom: 12px;
      border: 1px solid #444;
      border-radius: 9px;
      background: #303034;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    /* P&L Report Tabs & Styles */
    .pnl-summary-box {
      background: #252528;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      text-align: center;
      border: 1px solid #444;
    }
    .tab-container {
      display: flex;
      border-bottom: 1px solid #444;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      color: #fff;
      border-bottom: 3px solid var(--accent-red);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .pnl-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #222225;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 14px;
      border: 1px solid #333;
    }

    /* Modals & Forms */
    .proliv-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 15px;
      box-sizing: border-box;
    }
    .proliv-modal-content {
      background: #1c1c1e;
      border: 1px solid #444;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .proliv-form-group { margin-bottom: 12px; }
    .proliv-form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .proliv-form-group input, .proliv-form-group select, .proliv-form-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2e;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    .proliv-btn {
      background: var(--accent-red);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    .proliv-btn-secondary { background: #444; }
    .proliv-btn-green { background: #2e7d32; }
    .proliv-btn-danger { background: #c62828; padding: 4px 8px; font-size: 11px; }
    
    .card-item {
      background: #252528;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .flex-row { display: flex; gap: 10px; }
    .flex-row > div { flex: 1; }
  </style>
</head>
<body>

<div class="container">
  <!-- Brand Header with Backup Options -->
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="background: var(--accent-red); width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px;">P</div>
      <h2 style="margin: 0; font-size: 20px;">PROLIV PHYSIO</h2>
    </div>
    <div>
      <button class="proliv-btn" style="padding: 6px 10px; font-size: 12px;" onclick="exportBackup()">📥 Backup</button>
      <button class="proliv-btn proliv-btn-secondary" style="padding: 6px 10px; font-size: 12px;" onclick="document.getElementById('importFile').click()">📤 Restore</button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackup(event)">
    </div>
  </div>

  <!-- Dashboard Overview Stats (Clickable) -->
  <div class="stats-grid">
    <div class="stat-card" onclick="openPatientFilterModal('Live')"><small>Live Patients</small><div id="statLive">0</div></div>
    <div class="stat-card" onclick="openPatientFilterModal('All')"><small>Total Patients</small><div id="statTotal">0</div></div>
    <div class="stat-card" onclick="openPatientFilterModal('Discharged')"><small>Discharged</small><div id="statDischarged">0</div></div>
    <div class="stat-card" onclick="openSection('schedules-box')"><small>Schedules</small><div id="statSchedules">0</div></div>
    <div class="stat-card" onclick="openSection('fees-box')"><small>Collection</small><div id="statCollection" style="color:var(--accent-green);">₹0</div></div>
    <div class="stat-card" onclick="openSection('fees-box')"><small>Net Profit</small><div id="statProfit">₹0</div></div>
  </div>

  <!-- Main Navigation Grid Cards -->
  <div class="grid" id="proliv-section-navigation">
    <div class="card section-nav-card" onclick="openSection('patients-box')">
      <div class="card-icon">👥</div>
      <div class="card-label">Patients List</div>
      <div class="pill-badge" id="navPatientBadge">0</div>
    </div>
    <div class="card section-nav-card" onclick="openSection('schedules-box')">
      <div class="card-icon">📅</div>
      <div class="card-label">Schedules & Rehab</div>
      <div class="pill-badge dark" id="navScheduleBadge">0</div>
    </div>
    <div class="card section-nav-card" onclick="openSection('fees-box')">
      <div class="card-icon">💰</div>
      <div class="card-label">Fees & P&L</div>
      <div class="pill-badge green">Accounts</div>
    </div>
  </div>

  <!-- 1. Patients Section -->
  <section id="patients-box" class="section-box">
    <button type="button" class="section-home-btn" onclick="goHome()">← Home</button>
    <div class="section-header" id="patients-sec">
      <span>PATIENTS LIST</span>
    </div>
    <button class="proliv-btn" style="margin-bottom: 14px;" onclick="openAddPatientModal()">+ Add New Patient</button>
    <div id="patient-list-container"></div>
  </section>

  <!-- 2. Schedules Section -->
  <section id="schedules-box" class="section-box">
    <button type="button" class="section-home-btn" onclick="goHome()">← Home</button>
    <div class="section-header" id="schedules-sec">
      <span>SCHEDULES & REHAB</span>
    </div>
    <button class="proliv-btn" style="margin-bottom: 14px;" onclick="openAddScheduleModal()">+ Add Schedule / Rehab</button>
    <div id="schedules-list"></div>
  </section>

  <!-- 3. Fees & P&L Section -->
  <section id="fees-box" class="section-box">
    <button type="button" class="section-home-btn" onclick="goHome()">← Home</button>
    <div class="section-header" id="fees-sec">
      <span>P&L Report</span>
    </div>
    <div style="display:flex; gap:10px; margin-bottom:14px;">
      <button class="proliv-btn proliv-btn-green" style="flex:1;" onclick="openAddTransactionModal()">+ Add Income</button>
      <button class="proliv-btn proliv-btn-secondary" style="flex:1;" onclick="openAddExpenseModal()">+ Add Expense</button>
    </div>
    <div id="fees-list"></div>
  </section>
</div>

<!-- Modals Container -->
<div id="proliv-dynamic-modals">
  <!-- Patient Filter Modal -->
  <div id="patientFilterModal" class="proliv-modal">
    <div class="proliv-modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 id="filterModalTitle" style="margin:0;">Patient List</h3>
        <button class="proliv-btn proliv-btn-secondary" style="padding:4px 10px;" onclick="closeModals()">✕</button>
      </div>
      <div id="filteredPatientList"></div>
    </div>
  </div>

  <!-- Patient Modal -->
  <div id="patientModal" class="proliv-modal">
    <div class="proliv-modal-content">
      <h3 id="patientModalTitle" style="margin-top:0;">Patient Details</h3>
      <form id="patientForm">
        <input type="hidden" id="pId">
        <div class="proliv-form-group">
          <label>Patient Name *</label>
          <input type="text" id="pName" required>
        </div>
        <div class="flex-row">
          <div class="proliv-form-group">
            <label>Phone</label>
            <input type="tel" id="pPhone">
          </div>
          <div class="proliv-form-group">
            <label>Place / Location</label>
            <input type="text" id="pPlace">
          </div>
        </div>
        <div class="flex-row">
          <div class="proliv-form-group">
            <label>Plan / Treatment</label>
            <input type="text" id="pPlan">
          </div>
          <div class="proliv-form-group">
            <label>Total Fee (₹)</label>
            <input type="number" id="pFee" value="0">
          </div>
        </div>
        <div class="flex-row">
          <div class="proliv-form-group">
            <label>Paid Amount (₹)</label>
            <input type="number" id="pPaid" value="0">
          </div>
          <div class="proliv-form-group">
            <label>Status</label>
            <select id="pStatus">
              <option value="Live">Live</option>
              <option value="Discharged">Discharged</option>
            </select>
          </div>
        </div>
        <div class="flex-row">
          <div class="proliv-form-group">
            <label>Start Date</label>
            <input type="date" id="pStartDate">
          </div>
          <div class="proliv-form-group">
            <label>End Date (Discharge Date)</label>
            <input type="date" id="pEndDate">
          </div>
        </div>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <button type="submit" class="proliv-btn" style="flex:1;">Save Patient</button>
          <button type="button" class="proliv-btn proliv-btn-secondary" onclick="closeModals()" style="flex:1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Schedule Modal -->
  <div id="scheduleModal" class="proliv-modal">
    <div class="proliv-modal-content">
      <h3 id="scheduleModalTitle" style="margin-top:0;">Schedule & Rehab</h3>
      <form id="scheduleForm">
        <input type="hidden" id="sId">
        <div class="proliv-form-group">
          <label>Patient Name *</label>
          <input type="text" id="sName" required>
        </div>
        <div class="flex-row">
          <div class="proliv-form-group">
            <label>Date</label>
            <input type="date" id="sDate">
          </div>
          <div class="proliv-form-group">
            <label>Time</label>
            <input type="time" id="sTime">
          </div>
        </div>
        <div class="proliv-form-group">
          <label>Rehab Notes / Session Details</label>
          <textarea id="sNotes" rows="3"></textarea>
        </div>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <button type="submit" class="proliv-btn" style="flex:1;">Save Schedule</button>
          <button type="button" class="proliv-btn proliv-btn-secondary" onclick="closeModals()" style="flex:1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Expense Modal -->
  <div id="expenseModal" class="proliv-modal">
    <div class="proliv-modal-content">
      <h3 style="margin-top:0;">Add Clinic Expense</h3>
      <form id="expenseForm">
        <div class="proliv-form-group">
          <label>Expense Title / Reason *</label>
          <input type="text" id="eTitle" required>
        </div>
        <div class="proliv-form-group">
          <label>Amount (₹) *</label>
          <input type="number" id="eAmount" required>
        </div>
        <div class="proliv-form-group">
          <label>Date</label>
          <input type="date" id="eDate">
        </div>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <button type="submit" class="proliv-btn" style="flex:1;">Add Expense</button>
          <button type="button" class="proliv-btn proliv-btn-secondary" onclick="closeModals()" style="flex:1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Income/Transaction Modal -->
  <div id="transactionModal" class="proliv-modal">
    <div class="proliv-modal-content">
      <h3 style="margin-top:0;">Add Income</h3>
      <form id="transactionForm">
        <div class="proliv-form-group">
          <label>Source / Patient Name *</label>
          <input type="text" id="tTitle" required>
        </div>
        <div class="proliv-form-group">
          <label>Amount (₹) *</label>
          <input type="number" id="tAmount" required>
        </div>
        <div class="proliv-form-group">
          <label>Date</label>
          <input type="date" id="tDate">
        </div>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <button type="submit" class="proliv-btn proliv-btn-green" style="flex:1;">Add Income</button>
          <button type="button" class="proliv-btn proliv-btn-secondary" onclick="closeModals()" style="flex:1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBycFo1QjDvdbDC9vasPCx...", // നിങ്ങളുടെ ഒറിജിനൽ apiKey ഇവിടെ പൂർണ്ണമായി നൽകുക[span_2](start_span)[span_2](end_span)
    authDomain: "pgm-98fde.firebaseapp.com",
    projectId: "pgm-98fde",
    storageBucket: "pgm-98fde.appspot.com",
    messagingSenderId: "856565683408",
    appId: "1:856565683408:web:969eeafc4...",
    measurementId: "G-75DP1JVT6F"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.patients = [];
  window.schedules = [];
  window.expenses = [];
  window.transactions = [];

  function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  // Real-time synchronization from Firestore
  onSnapshot(collection(db, "patients"), (snapshot) => {
    window.patients = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
    renderAllData();
  });

  onSnapshot(collection(db, "schedules"), (snapshot) => {
    window.schedules = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
    renderAllData();
  });

  onSnapshot(collection(db, "expenses"), (snapshot) => {
    window.expenses = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
    renderAllData();
  });

  onSnapshot(collection(db, "transactions"), (snapshot) => {
    window.transactions = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
    renderAllData();
  });

  // Backup Export Function
  window.exportBackup = function() {
    const backupData = {
      patients: window.patients,
      schedules: window.schedules,
      expenses: window.expenses,
      transactions: window.transactions,
      version: "1.0",
      date: new Date().toISOString()
    };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "proliv_physio_backup_" + new Date().toISOString().split('T')[0] + ".json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  };

  // Backup Import Function
  window.importBackup = function(event) {
    const fileReader = new FileReader();
    if(event.target.files[0]) {
      fileReader.readAsText(event.target.files[0], "UTF-8");
      fileReader.onload = async function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if(parsed.patients || parsed.expenses) {
            if(confirm("ഇത് നിലവിലുള്ള ഡാറ്റ പുതിയ ബാക്കപ്പ് ഫയൽ ഉപയോഗിച്ച് റീപ്ലേസ് ചെയ്യും. തുടരണോ?")) {
              // Clear & upload to Firestore
              for(let p of (parsed.patients || [])) { delete p.id; await addDoc(collection(db, "patients"), p); }
              for(let s of (parsed.schedules || [])) { delete s.id; await addDoc(collection(db, "schedules"), s); }
              for(let ex of (parsed.expenses || [])) { delete ex.id; await addDoc(collection(db, "expenses"), ex); }
              for(let t of (parsed.transactions || [])) { delete t.id; await addDoc(collection(db, "transactions"), t); }
              alert("ഡാറ്റ വിജയകരമായി റെസ്റ്റോർ (Restore) ചെയ്തു!");
            }
          } else {
            alert("തെറ്റായ ബാക്കപ്പ് ഫയൽ ഫോർമാറ്റ്!");
          }
        } catch(err) {
          alert("ഫയൽ റീഡ് ചെയ്യുന്നതിൽ പരാജയപ്പെട്ടു: " + err);
        }
      };
    }
  };

  // Forms Handlers
  document.getElementById("patientForm").onsubmit = async function(e) {
    e.preventDefault();
    const id = document.getElementById("pId").value;
    const patientData = {
      name: document.getElementById("pName").value,
      phone: document.getElementById("pPhone").value,
      place: document.getElementById("pPlace").value,
      plan: document.getElementById("pPlan").value,
      fee: parseFloat(document.getElementById("pFee").value) || 0,
      paid: parseFloat(document.getElementById("pPaid").value) || 0,
      status: document.getElementById("pStatus").value,
      startDate: document.getElementById("pStartDate").value,
      endDate: document.getElementById("pEndDate").value
    };
    const todayStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    if (!id) {
      await addDoc(collection(db, "patients"), patientData);
      if(patientData.paid > 0) {
        await addDoc(collection(db, "transactions"), { title: patientData.name, amount: patientData.paid, date: todayStr, type: 'income' });
      }
    } else {
      await setDoc(doc(db, "patients", id), patientData);
    }
    closeModals();
  };

  document.getElementById("scheduleForm").onsubmit = async function(e) {
    e.preventDefault();
    const id = document.getElementById("sId").value;
    const scheduleData = {
      name: document.getElementById("sName").value,
      date: document.getElementById("sDate").value,
      time: document.getElementById("sTime").value,
      notes: document.getElementById("sNotes").value
    };
    if (!id) {
      await addDoc(collection(db, "schedules"), scheduleData);
    } else {
      await setDoc(doc(db, "schedules", id), scheduleData);
    }
    closeModals();
  };

  document.getElementById("expenseForm").onsubmit = async function(e) {
    e.preventDefault();
    const dateVal = document.getElementById("eDate").value;
    const formattedDate = dateVal ? new Date(dateVal).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    
    await addDoc(collection(db, "expenses"), {
      title: document.getElementById("eTitle").value,
      amount: parseFloat(document.getElementById("eAmount").value) || 0,
      date: formattedDate
    });
    closeModals();
  };

  document.getElementById("transactionForm").onsubmit = async function(e) {
    e.preventDefault();
    const dateVal = document.getElementById("tDate").value;
    const formattedDate = dateVal ? new Date(dateVal).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    await addDoc(collection(db, "transactions"), {
      title: document.getElementById("tTitle").value,
      amount: parseFloat(document.getElementById("tAmount").value) || 0,
      type: 'income',
      date: formattedDate
    });
    closeModals();
  };

  window.openPatientFilterModal = function(type) {
    const titleEl = document.getElementById("filterModalTitle");
    const listEl = document.getElementById("filteredPatientList");
    
    let filtered = window.patients;
    if(type === 'Live') {
      titleEl.textContent = "Live Patients List";
      filtered = window.patients.filter(p => (p.status || 'Live') === 'Live');
    } else if(type === 'Discharged') {
      titleEl.textContent = "Discharged Patients List";
      filtered = window.patients.filter(p => p.status === 'Discharged');
    } else {
      titleEl.textContent = "Total Patients List";
    }

    listEl.innerHTML = filtered.length === 0 ? "<p style='color:#777; text-align:center;'>No patients found.</p>" : "";
    filtered.forEach((p) => {
      let statusBadgeColor = p.status === 'Discharged' ? 'color:#d32f2f;' : 'color:#4caf50;';
      let dischargeInfo = p.status === 'Discharged' && p.endDate ? `<br><small style="color:#aaa;">Discharge Date: ${escapeHTML(p.endDate)}</small>` : '';
      
      listEl.innerHTML += `
        <div class="card-item">
          <div style="flex:1; cursor:pointer;" onclick="closeModals(); editPatient('${p.id}');">
            <strong>${escapeHTML(p.name)}</strong> <span style="font-size:11px; ${statusBadgeColor}">(${escapeHTML(p.status || 'Live')})</span><br>
            <small style="color:#aaa;">📞 ${escapeHTML(p.phone || 'N/A')} | 📍 ${escapeHTML(p.place || 'N/A')}</small>
            ${dischargeInfo}
          </div>
          <div>
            <button class="proliv-btn" style="padding:6px 10px; font-size:12px;" onclick="closeModals(); editPatient('${p.id}');">Edit</button>
          </div>
        </div>
      `;
    });

    document.getElementById("patientFilterModal").style.display = "flex";
  };

  window.openAddPatientModal = function() {
    document.getElementById("patientModalTitle").textContent = "Add New Patient";
    document.getElementById("pId").value = "";
    document.getElementById("pName").value = "";
    document.getElementById("pPhone").value = "";
    document.getElementById("pPlace").value = "";
    document.getElementById("pPlan").value = "";
    document.getElementById("pFee").value = "0";
    document.getElementById("pPaid").value = "0";
    document.getElementById("pStatus").value = "Live";
    document.getElementById("pStartDate").value = "";
    document.getElementById("pEndDate").value = "";
    document.getElementById("patientModal").style.display = "flex";
  };

  window.editPatient = function(id) {
    const p = window.patients.find(item => item.id === id);
    if(!p) return;
    document.getElementById("patientModalTitle").textContent = "Edit Patient & Discharge Details";
    document.getElementById("pId").value = p.id;
    document.getElementById("pName").value = p.name || "";
    document.getElementById("pPhone").value = p.phone || "";
    document.getElementById("pPlace").value = p.place || "";
    document.getElementById("pPlan").value = p.plan || "";
    document.getElementById("pFee").value = p.fee !== undefined ? p.fee : 0;
    document.getElementById("pPaid").value = p.paid !== undefined ? p.paid : 0;
    document.getElementById("pStatus").value = p.status || "Live";
    document.getElementById("pStartDate").value = p.startDate || "";
    document.getElementById("pEndDate").value = p.endDate || "";
    document.getElementById("patientModal").style.display = "flex";
  };

  window.deletePatient = async function(id) {
    if (confirm("Delete this patient?")) {
      await deleteDoc(doc(db, "patients", id));
    }
  };

  window.openAddScheduleModal = function() {
    document.getElementById("scheduleModalTitle").textContent = "Add Schedule";
    document.getElementById("sId").value = "";
    document.getElementById("sName").value = "";
    document.getElementById("sDate").value = "";
    document.getElementById("sTime").value = "";
    document.getElementById("sNotes").value = "";
    document.getElementById("scheduleModal").style.display = "flex";
  };

  window.editSchedule = function(id) {
    const s = window.schedules.find(item => item.id === id);
    if(!s) return;
    document.getElementById("scheduleModalTitle").textContent = "Edit Schedule";
    document.getElementById("sId").value = s.id;
    document.getElementById("sName").value = s.name || "";
    document.getElementById("sDate").value = s.date || "";
    document.getElementById("sTime").value = s.time || "";
    document.getElementById("sNotes").value = s.notes || "";
    document.getElementById("scheduleModal").style.display = "flex";
  };

  window.deleteSchedule = async function(id) {
    if (confirm("Delete this schedule?")) {
      await deleteDoc(doc(db, "schedules", id));
    }
  };

  window.openAddExpenseModal = function() {
    document.getElementById("eTitle").value = "";
    document.getElementById("eAmount").value = "";
    document.getElementById("eDate").value = new Date().toISOString().split('T')[0];
    document.getElementById("expenseModal").style.display = "flex";
  };

  window.openAddTransactionModal = function() {
    document.getElementById("tTitle").value = "";
    document.getElementById("tAmount").value = "";
    document.getElementById("tDate").value = new Date().toISOString().split('T')[0];
    document.getElementById("transactionModal").style.display = "flex";
  };

  window.deleteExpense = async function(id) {
    await deleteDoc(doc(db, "expenses", id));
  };

  window.deleteTransaction = async function(id) {
    await deleteDoc(doc(db, "transactions", id));
  };

  window.closeModals = function() {
    document.getElementById("patientModal").style.display = "none";
    document.getElementById("scheduleModal").style.display = "none";
    document.getElementById("expenseModal").style.display = "none";
    document.getElementById("transactionModal").style.display = "none";
    document.getElementById("patientFilterModal").style.display = "none";
  };

  window.switchPnlTab = function(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    if(tabName === 'collection') {
      document.getElementById('colTabBtn').classList.add('active');
      document.getElementById('collectionTabContent').classList.add('active');
    } else {
      document.getElementById('expTabBtn').classList.add('active');
      document.getElementById('expenseTabContent').classList.add('active');
    }
  };

  function getFinancials() {
    let totalCollection = window.transactions.reduce((sum, t) => sum + (t.amount || 0), 0);
    let totalExpense = window.expenses.reduce((sum, e) => sum + (e.amount || 0), 0);
    let netProfit = totalCollection - totalExpense;
    return { totalCollection, totalExpense, netProfit };
  }

  function renderAllData() {
    const pContainer = document.getElementById("patient-list-container");
    pContainer.innerHTML = window.patients.length === 0 ? "<p style='color:#777;'>No patients added yet.</p>" : "";
    window.patients.forEach((p) => {
      let feeVal = p.fee !== undefined ? p.fee : 0;
      let paidVal = p.paid !== undefined ? p.paid : 0;
      let due = feeVal - paidVal;
      
      pContainer.innerHTML += `
        <div class="card-item">
          <div style="flex:1; cursor:pointer;" onclick="editPatient('${p.id}')">
            <strong>${escapeHTML(p.name)}</strong> (${escapeHTML(p.status || 'Live')})<br>
            <small style="color:#aaa;">📞 ${escapeHTML(p.phone || 'N/A')} | 📍 ${escapeHTML(p.place || 'N/A')}</small><br>
            <small style="color:#4caf50;">Paid: ₹${paidVal}</small> | <small style="color:${due > 0 ? '#f44336':'#aaa'};">Due: ₹${due}</small>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="proliv-btn" style="padding:6px 10px; font-size:12px;" onclick="editPatient('${p.id}')">Edit</button>
            <button class="proliv-btn proliv-btn-danger" onclick="deletePatient('${p.id}')">Del</button>
          </div>
        </div>
      `;
    });

    const sContainer = document.getElementById("schedules-list");
    sContainer.innerHTML = window.schedules.length === 0 ? "<p style='color:#777;'>No schedules available.</p>" : "";
    window.schedules.forEach((s) => {
      sContainer.innerHTML += `
        <div class="card-item">
          <div style="flex:1; cursor:pointer;" onclick="editSchedule('${s.id}')">
            <strong>${escapeHTML(s.name)}</strong><br>
            <small style="color:#aaa;">📅 ${escapeHTML(s.date || 'No Date')} | ⏰ ${escapeHTML(s.time || 'No Time')}</small>
            <p style="margin:4px 0 0 0; font-size:13px; color:#ddd;">Rehab: ${escapeHTML(s.notes || 'None')}</p>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="proliv-btn" style="padding:6px 10px; font-size:12px;" onclick="editSchedule('${s.id}')">Edit</button>
            <button class="proliv-btn proliv-btn-danger" onclick="deleteSchedule('${s.id}')">Del</button>
          </div>
        </div>
      `;
    });

    const fContainer = document.getElementById("fees-list");
    const fin = getFinancials();

    fContainer.innerHTML = `
      <div class="pnl-summary-box">
        <div style="font-size: 15px; margin-bottom: 6px;">Net Profit: <b>₹${fin.netProfit}</b> Total</div>
        <div style="font-size: 13px; color: var(--text-muted);">Collection : <span style="color:var(--accent-green);">${fin.totalCollection}</span> &nbsp; Expense : <span style="color:var(--accent-red);">${fin.totalExpense}</span></div>
      </div>

      <div class="tab-container">
        <button id="colTabBtn" class="tab-btn active" onclick="switchPnlTab('collection')">Collection</button>
        <button id="expTabBtn" class="tab-btn" onclick="switchPnlTab('expense')">Expense</button>
      </div>

      <div id="collectionTabContent" class="tab-content active">
        ${window.transactions.length === 0 ? "<p style='color:#777; text-align:center;'>No collection records.</p>" : ""}
        ${window.transactions.map((t) => `
          <div class="pnl-row">
            <span style="color:var(--text-muted); font-size:13px;">${escapeHTML(t.date || 'N/A')}</span>
            <span style="font-weight:600;">${escapeHTML(t.title || 'Income')}</span>
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="color:var(--accent-green); font-weight:bold;">${t.amount}</span>
              <button class="proliv-btn proliv-btn-danger" onclick="deleteTransaction('${t.id}')">X</button>
            </div>
          </div>
        `).join('')}
      </div>

      <div id="expenseTabContent" class="tab-content">
        ${window.expenses.length === 0 ? "<p style='color:#777; text-align:center;'>No expense records.</p>" : ""}
        ${window.expenses.map((e) => `
          <div class="pnl-row">
            <span style="color:var(--text-muted); font-size:13px;">${escapeHTML(e.date || 'N/A')}</span>
            <span style="font-weight:600;">${escapeHTML(e.title || 'Expense')}</span>
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="color:var(--accent-red); font-weight:bold;">${e.amount}</span>
              <button class="proliv-btn proliv-btn-danger" onclick="deleteExpense('${e.id}')">X</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;

    updateDashboardStats();
  }

  function updateDashboardStats() {
    const liveCount = window.patients.filter(p => (p.status || 'Live') === "Live").length;
    const totalCount = window.patients.length;
    const dischargedCount = window.patients.filter(p => p.status === "Discharged").length;
    const schedCount = window.schedules.length;
    const fin = getFinancials();

    document.getElementById("statLive").textContent = liveCount;
    document.getElementById("statTotal").textContent = totalCount;
    document.getElementById("statDischarged").textContent = dischargedCount;
    document.getElementById("statSchedules").textContent = schedCount;
    document.getElementById("statCollection").textContent = "₹" + fin.totalCollection;
    document.getElementById("statProfit").textContent = "₹" + fin.netProfit;

    document.getElementById("navPatientBadge").textContent = totalCount;
    document.getElementById("navScheduleBadge").textContent = schedCount;
  }

  window.openSection = function(sectionId) {
    document.querySelectorAll(".section-box").forEach(function (box) {
      box.style.display = "none";
    });
    document.getElementById("proliv-section-navigation").style.display = "none";
    document.querySelector(".stats-grid").style.display = "none";
    
    const selected = document.getElementById(sectionId);
    if (selected) selected.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  window.goHome = function() {
    document.querySelectorAll(".section-box").forEach(function (box) {
      box.style.display = "none";
    });
    document.getElementById("proliv-section-navigation").style.display = "grid";
    document.querySelector(".stats-grid").style.display = "grid";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
</script>
</body>
</html>
