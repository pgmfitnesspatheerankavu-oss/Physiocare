<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGM Physio & Rehab Dashboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-primary: #00e676;
            --accent-secondary: #29b6f6;
            --accent-warning: #ffa726;
            --accent-danger: #ef5350;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-size: 1.4rem;
            letter-spacing: 0.5px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 95px;
        }

        .card:active {
            transform: scale(0.96);
            background-color: #2a2a2a;
        }

        .card-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .card-value {
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Card Specific Colors */
        .c-green { color: var(--accent-primary); }
        .c-blue { color: var(--accent-secondary); }
        .c-orange { color: var(--accent-warning); }
        .c-red { color: var(--accent-danger); }

        @media (max-width: 480px) {
            .dashboard-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .card {
                padding: 10px 5px;
                min-height: 85px;
            }
            .card-title {
                font-size: 0.65rem;
            }
            .card-value {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>PGM PHYSIO</h1>
        <div style="font-size: 0.9rem; color: #00e676;">● Active</div>
    </header>

    <div class="dashboard-grid">
        <!-- Row 1 -->
        <div class="card" onclick="showAlert('Active Patients: 8', 'Patients currently undergoing therapy sessions.')">
            <span class="card-title">Active Patients</span>
            <span class="card-value c-blue">8</span>
        </div>
        <div class="card" onclick="showAlert('Total Registered: 64', 'Total patients registered for physiotherapy since inception.')">
            <span class="card-title">Total Patients</span>
            <span class="card-value">64</span>
        </div>
        <div class="card" onclick="showAlert('Completed Sessions: 42', 'Patients who have completed their prescribed sessions.')">
            <span class="card-title">Completed</span>
            <span class="card-value c-green">42</span>
        </div>

        <!-- Row 2 -->
        <div class="card" onclick="showAlert('Rehab (1-3 Days): 2', 'Patients starting early rehabilitation phase.')">
            <span class="card-title">Rehab (1-3 Days)</span>
            <span class="card-value c-orange">2</span>
        </div>
        <div class="card" onclick="showAlert('Follow-up Due: 5', 'Patients scheduled for follow-up evaluation this week.')">
            <span class="card-title">Follow-up Due</span>
            <span class="card-value c-warning">5</span>
        </div>
        <div class="card" onclick="showAlert('Discharged: 14', 'Successfully recovered and discharged patients.')">
            <span class="card-title">Discharged</span>
            <span class="card-value c-muted">14</span>
        </div>

        <!-- Row 3 -->
        <div class="card" onclick="showAlert('Today Collection: ₹1,500', 'Revenue collected from therapy sessions today.')">
            <span class="card-title">Today Collection</span>
            <span class="card-value c-green">₹1.5K</span>
        </div>
        <div class="card" onclick="showAlert('Weekly Collection: ₹12,400', 'Total revenue collected over the past 7 days.')">
            <span class="card-title">Weekly Collection</span>
            <span class="card-value c-blue">₹12.4K</span>
        </div>
        <div class="card" onclick="showAlert('Monthly Collection: ₹48,000', 'Total revenue collected for the current month.')">
            <span class="card-title">Monthly Collection</span>
            <span class="card-value c-green">₹48K</span>
        </div>

        <!-- Row 4 -->
        <div class="card" onclick="showAlert('Yearly Collection: ₹3.2L', 'Total revenue generated in the current year.')">
            <span class="card-title">Collection(2026)</span>
            <span class="card-value c-blue">₹3.2L</span>
        </div>
        <div class="card" onclick="showAlert('Pending Dues: ₹2,000', 'Outstanding payments from ongoing sessions.')">
            <span class="card-title">Due Amount</span>
            <span class="card-value c-red">₹2.0K</span>
        </div>
        <div class="card" onclick="showAlert('Clinic Expenses: ₹14,500', 'Total operational and equipment expenses.')">
            <span class="card-title">Total Expense</span>
            <span class="card-value c-red">₹14.5K</span>
        </div>
    </div>

    <script>
        function showAlert(title, message) {
            alert(title + "\n\n" + message);
        }
    </script>
</body>
</html>
