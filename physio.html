<!-- PROLIV PHYSIO APP NAVIGATION + CARD LAYOUT WITH PATIENT DETAILS, SCHEDULING & P&L -->
<style>
  .section-box {
    display: none;
    background: var(--card-bg, #1c1c1e);
    border: 1px solid #333;
    border-radius: 16px;
    padding: 14px;
    margin: 14px 0;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .2);
    color: #fff;
  }

  .section-box .section-header {
    margin: 12px 0;
    padding-bottom: 12px;
    border-bottom: 1px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .section-home-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 9px 14px;
    margin-bottom: 8px;
    border: 1px solid #444;
    border-radius: 9px;
    background: #303034;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }

  .section-nav-card {
    transition: transform .15s ease, border-color .15s ease;
    cursor: pointer;
    user-select: none;
  }

  .section-nav-card:active {
    transform: scale(.96);
    border-color: var(--red-accent, #d32f2f);
  }

  /* Modal / Detail View Styles */
  .proliv-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .proliv-modal-content {
    background: #1c1c1e;
    border: 1px solid #444;
    border-radius: 14px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 20px;
    color: #fff;
  }
  .proliv-form-group {
    margin-bottom: 12px;
  }
  .proliv-form-group label {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
    color: #aaa;
  }
  .proliv-form-group input, .proliv-form-group select, .proliv-form-group textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #2a2a2e;
    color: #fff;
  }
  .proliv-btn {
    background: #d32f2f;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .proliv-btn-secondary {
    background: #444;
  }
  .patient-item-card {
    background: #252528;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    border: 1px solid #333;
  }
</style>

<script>
(function () {
  "use strict";

  // Ensure global data store
  window.patients = window.patients || [];
  window.expenses = window.expenses || [];

  const sectionDefinitions = [
    {
      id: "patients-box",
      headerId: "patients-sec",
      contentId: "patient-list-container",
      title: "PATIENTS LIST",
      icon: "👥",
      label: "Patients List",
      badge: "Patients"
    },
    {
      id: "schedules-box",
      headerId: "schedules-sec",
      contentId: "schedules-list",
      title: "SCHEDULES & REHAB",
      icon: "📅",
      label: "Schedules & Rehab",
      badge: "Sessions"
    },
    {
      id: "fees-box",
      headerId: "fees-sec",
      contentId: "fees-list",
      title: "FEES & ACCOUNTS (P&L)",
      icon: "💰",
      label: "Fees & P&L",
      badge: "Accounts"
    }
  ];

  function initializeProlivCards() {
    const dashboard = document.querySelector(".grid");

    if (!dashboard) {
      console.error("PROLIV PHYSIO dashboard grid not found.");
      return;
    }

    if (document.getElementById("proliv-section-navigation")) return;

    // Build Navigation Cards
    const navigation = document.createElement("div");
    navigation.id = "proliv-section-navigation";
    navigation.className = "grid section-nav";
    navigation.style.marginBottom = "20px";

    sectionDefinitions.forEach(function (section, index) {
      const card = document.createElement("div");
      card.className = "card section-nav-card";
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", "Open " + section.label);

      card.innerHTML = `
        <div class="card-icon">${section.icon}</div>
        <div class="card-label">${section.label}</div>
        <div class="pill-badge ${index === 1 ? "dark" : index === 2 ? "green" : ""}">${section.badge}</div>
      `;

      card.addEventListener("click", function () {
        openSection(section.id);
      });

      navigation.appendChild(card);
    });

    dashboard.parentNode.insertBefore(navigation, dashboard);

    // Wrap sections & Add Add Action Buttons
    sectionDefinitions.forEach(function (section) {
      const header = document.getElementById(section.headerId);
      const content = document.getElementById(section.contentId);

      if (!header || !content) return;

      const box = document.createElement("section");
      box.id = section.id;
      box.className = "section-box";

      const homeButton = document.createElement("button");
      homeButton.type = "button";
      homeButton.className = "section-home-btn";
      homeButton.textContent = "← Home";
      homeButton.addEventListener("click", goHome);

      header.parentNode.insertBefore(box, header);
      box.appendChild(homeButton);
      box.appendChild(header);

      // Add specific action buttons based on section
      if (section.id === "patients-box") {
        const addBtn = document.createElement("button");
        addBtn.className = "proliv-btn";
        addBtn.style.margin = "10px 0";
        addBtn.textContent = "+ Add New Patient";
        addBtn.onclick = openAddPatientModal;
        box.appendChild(addBtn);
      } else if (section.id === "fees-box") {
        const addExpBtn = document.createElement("button");
        addExpBtn.className = "proliv-btn proliv-btn-secondary";
        addExpBtn.style.margin = "10px 0";
        addExpBtn.textContent = "+ Add Expense";
        addExpBtn.onclick = openAddExpenseModal;
        box.appendChild(addExpBtn);
      }

      box.appendChild(content);
    });

    // Patient Count Badge
    const patientCount = document.createElement("span");
    patientCount.id = "proliv-nav-patient-count";
    patientCount.className = "pill-badge";
    patientCount.style.marginTop = "5px";

    const patientCard = navigation.children[0];
    const oldBadge = patientCard.querySelector(".pill-badge");
    if (oldBadge) oldBadge.replaceWith(patientCount);

    createModals();
    updateNavigationPatientCount();
    renderProlivData();
    goHome();
  }

  // Create Modals for Patient Add/Edit & Expenses
  function createModals() {
    if (document.getElementById("proliv-dynamic-modals")) return;

    const modalContainer = document.createElement("div");
    modalContainer.id = "proliv-dynamic-modals";
    modalContainer.innerHTML = `
      <div id="patientModal" class="proliv-modal">
        <div class="proliv-modal-content">
          <h3 id="modalTitle">Patient Details</h3>
          <form id="patientForm">
            <input type="hidden" id="pIndex">
            <div class="proliv-form-group">
              <label>Patient Name</label>
              <input type="text" id="pName" required>
            </div>
            <div class="proliv-form-group">
              <label>Appointment Time / Schedule</label>
              <input type="time" id="pTime" required>
            </div>
            <div class="proliv-form-group">
              <label>Rehab Status / Notes</label>
              <textarea id="pRehab" rows="3"></textarea>
            </div>
            <div class="proliv-form-group">
              <label>Fee Amount (₹)</label>
              <input type="number" id="pFee" value="0">
            </div>
            <div class="proliv-form-group">
              <label>Status</label>
              <select id="pStatus">
                <option value="Live">Live</option>
                <option value="Discharged">Discharged</option>
              </select>
            </div>
            <div style="display:flex; gap:10px; margin-top:15px;">
              <button type="submit" class="proliv-btn">Save Patient</button>
              <button type="button" class="proliv-btn proliv-btn-secondary" onclick="closeModals()">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <div id="expenseModal" class="proliv-modal">
        <div class="proliv-modal-content">
          <h3>Add Clinic Expense</h3>
          <form id="expenseForm">
            <div class="proliv-form-group">
              <label>Expense Title / Reason</label>
              <input type="text" id="eTitle" required>
            </div>
            <div class="proliv-form-group">
              <label>Amount (₹)</label>
              <input type="number" id="eAmount" required>
            </div>
            <div style="display:flex; gap:10px; margin-top:15px;">
              <button type="submit" class="proliv-btn">Add Expense</button>
              <button type="button" class="proliv-btn proliv-btn-secondary" onclick="closeModals()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    `;
    document.body.appendChild(modalContainer);

    // Form Submissions
    document.getElementById("patientForm").onsubmit = function(e) {
      e.preventDefault();
      const index = document.getElementById("pIndex").value;
      const patientData = {
        name: document.getElementById("pName").value,
        time: document.getElementById("pTime").value,
        rehab: document.getElementById("pRehab").value,
        fee: parseFloat(document.getElementById("pFee").value) || 0,
        status: document.getElementById("pStatus").value
      };

      if (index === "") {
        window.patients.push(patientData);
      } else {
        window.patients[index] = patientData;
      }

      closeModals();
      renderProlivData();
    };

    document.getElementById("expenseForm").onsubmit = function(e) {
      e.preventDefault();
      const expenseData = {
        title: document.getElementById("eTitle").value,
        amount: parseFloat(document.getElementById("eAmount").value) || 0,
        date: new Date().toLocaleDateString()
      };
      window.expenses.push(expenseData);
      closeModals();
      renderProlivData();
    };
  }

  window.openAddPatientModal = function() {
    document.getElementById("modalTitle").textContent = "Add New Patient";
    document.getElementById("pIndex").value = "";
    document.getElementById("pName").value = "";
    document.getElementById("pTime").value = "";
    document.getElementById("pRehab").value = "";
    document.getElementById("pFee").value = "0";
    document.getElementById("pStatus").value = "Live";
    document.getElementById("patientModal").style.display = "flex";
  };

  window.editPatient = function(index) {
    const p = window.patients[index];
    document.getElementById("modalTitle").textContent = "Edit Patient Details";
    document.getElementById("pIndex").value = index;
    document.getElementById("pName").value = p.name;
    document.getElementById("pTime").value = p.time || "";
    document.getElementById("pRehab").value = p.rehab || "";
    document.getElementById("pFee").value = p.fee || 0;
    document.getElementById("pStatus").value = p.status || "Live";
    document.getElementById("patientModal").style.display = "flex";
  };

  window.openAddExpenseModal = function() {
    document.getElementById("eTitle").value = "";
    document.getElementById("eAmount").value = "";
    document.getElementById("expenseModal").style.display = "flex";
  };

  window.closeModals = function() {
    document.getElementById("patientModal").style.display = "none";
    document.getElementById("expenseModal").style.display = "none";
  };

  function renderProlivData() {
    // 1. Render Patients List
    const pContainer = document.getElementById("patient-list-container");
    if (pContainer) {
      pContainer.innerHTML = window.patients.length === 0 ? "<p style='color:#777;'>No patients added yet.</p>" : "";
      window.patients.forEach((p, idx) => {
        pContainer.innerHTML += `
          <div class="patient-item-card" onclick="editPatient(${idx})">
            <div>
              <strong>${p.name}</strong><br>
              <small style="color:#aaa;">Time: ${p.time || 'Not Set'} | Status: ${p.status}</small>
            </div>
            <div><span>👉 Edit</span></div>
          </div>
        `;
      });
    }

    // 2. Render Schedules List
    const sContainer = document.getElementById("schedules-list");
    if (sContainer) {
      sContainer.innerHTML = window.patients.length === 0 ? "<p style='color:#777;'>No schedules available.</p>" : "";
      window.patients.forEach((p) => {
        sContainer.innerHTML += `
          <div style="background:#252528; padding:10px; border-radius:8px; margin-bottom:8px;">
            <strong>${p.name}</strong> - ⏰ ${p.time || 'No Time'}
            <p style="margin:5px 0 0 0; font-size:13px; color:#ccc;">Rehab: ${p.rehab || 'None'}</p>
          </div>
        `;
      });
    }

    // 3. Render P&L Accounts & Expenses
    const fContainer = document.getElementById("fees-list");
    if (fContainer) {
      let totalCollection = window.patients.reduce((sum, p) => sum + (p.fee || 0), 0);
      let totalExpense = window.expenses.reduce((sum, e) => sum + (e.amount || 0), 0);
      let netProfit = totalCollection - totalExpense;

      fContainer.innerHTML = `
        <div style="background:#252528; padding:12px; border-radius:8px; margin-bottom:10px;">
          <p><strong>Total Collection:</strong> ₹${totalCollection}</p>
          <p><strong>Total Expenses:</strong> ₹${totalExpense}</p>
          <p style="color: ${netProfit >= 0 ? '#4caf50' : '#f44336'};"><strong>Net Profit:</strong> ₹${netProfit}</p>
        </div>
        <h4>Expense History</h4>
        ${window.expenses.length === 0 ? "<p style='color:#777;'>No expenses recorded.</p>" : ""}
        ${window.expenses.map(e => `<div style="background:#222; padding:8px; border-radius:6px; margin-bottom:5px; font-size:13px;">${e.title} : <b>₹${e.amount}</b> (${e.date})</div>`).join('')}
      `;
    }

    updateNavigationPatientCount();
  }

  function openSection(sectionId) {
    document.querySelectorAll(".section-box").forEach(function (box) {
      box.style.display = "none";
    });
    const selected = document.getElementById(sectionId);
    if (selected) selected.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function goHome() {
    document.querySelectorAll(".section-box").forEach(function (box) {
      box.style.display = "none";
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function updateNavigationPatientCount() {
    const countElement = document.getElementById("proliv-nav-patient-count");
    if (countElement && Array.isArray(window.patients)) {
      countElement.textContent = window.patients.length;
    }
  }

  window.openProlivSection = openSection;
  window.goHome = goHome;
  window.updateProlivPatientCount = updateNavigationPatientCount;

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initializeProlivCards);
  } else {
    initializeProlivCards();
  }
})();
</script>
<!-- END PROLIV PHYSIO APP -->
