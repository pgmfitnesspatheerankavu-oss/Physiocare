<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proliv Physio Management</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1c1c1e;
      --border-color: #333;
      --accent-red: #d32f2f;
      --accent-green: #4caf50;
      --text-main: #ffffff;
      --text-muted: #aaa;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 10px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .card:active { transform: scale(0.96); border-color: var(--accent-red); }
    .card-icon { font-size: 20px; margin-bottom: 4px; }
    .card-label { font-size: 12px; font-weight: 600; color: #ddd; }
    .pill-badge {
      display: inline-block;
      background: var(--accent-red);
      color: white;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 8px;
      margin-top: 4px;
    }
    .pill-badge.green { background: var(--accent-green); }
    .pill-badge.dark { background: #444; }

    /* Top Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
    }
    .stat-card small { color: var(--text-muted); font-size: 10px; }
    .stat-card div:last-child { font-size: 14px; font-weight: bold; margin-top: 2px; }

    .section-box {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      margin: 10px 0;
    }
    .section-header {
      margin: 8px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
    }
    .section-home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      margin-bottom: 10px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #303034;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    /* P&L Report Tabs & Styles */
    .pnl-summary-box {
      background: #252528;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 12px;
      text-align: center;
      border: 1px solid #444;
      font-size: 13px;
    }
    .tab-container {
      display: flex;
      border-bottom: 1px solid #444;
      margin-bottom: 12px;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active { color: #fff; border-bottom: 2px solid var(--accent-red); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .pnl-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #222225;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 12px;
      border: 1px solid #333;
    }

    /* Modals & Forms */
    .proliv-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
    }
    .proliv-modal-content {
      background: #1c1c1e;
      border: 1px solid #444;
      border-radius: 14px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 16px;
    }
    .proliv-form-group { margin-bottom: 10px; }
    .proliv-form-group label { display: block; margin-bottom: 3px; font-size: 12px; color: var(--text-muted); }
    .proliv-form-group input, .proliv-form-group select, .proliv-form-group textarea {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2e;
      color: #fff;
      font-size: 13px;
      box-sizing: border-box;
    }
    .proliv-btn {
      background: var(--accent-red);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .proliv-btn-secondary { background: #444; }
    .proliv-btn-green { background: #2e7d32; }
    .proliv-btn-danger { background: #c62828; padding: 3px 6px; font-size: 10px; }
    
    /* Super Compact List Item for 50+ Screen View */
    .card-item {
      background: #252528;
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      border: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .flex-row { display: flex; gap: 8px; }
    .flex-row > div { flex: 1; }
  </style>
</head>
<body>

<div class="container">
  <!-- Brand Header with Backup Options -->
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="background: var(--accent-red); width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px;">P</div>
      <h2 style="margin: 0; font-size: 17px;">PROLIV PHYSIO</h2>
    </div>
    <div>
      <button class="proliv-btn" style="padding: 4px 8px; font-size: 11px;" onclick="exportBackup()">📥 Backup</button>
      <button class="proliv-btn proliv-btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="document.getElementById('importFile').click()">📤 Restore</button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackup(event)">
    </div>
  </div>

  <!-- Dashboard Overview Stats -->
  <div class="stats-grid">
    <div class="stat-card" onclick="openPatientFilterModal('Live')"><small>Live</small><div id="statLive">0</div></div>
    <div class="stat-card" onclick="openPatientFilterModal('All')"><small>Total</small><div id="statTotal">0</div></div>
    <div class="stat-card" onclick="openPatientFilterModal('Discharged')"><small>Discharged</small><div id="statDischarged">0</div></div>
    <div class="stat-card" onclick="openSection('schedules-box')"><small>Schedules</small><div id="statSchedules">0</div></div>
    <div class="stat-card" onclick="openSection('fees-box')"><small>Collection</small><div id="statCollection" style="color:var(--accent-green);">₹0</div></div>
    <div class="stat-card" onclick="openSection('fees-box')"><small>Profit</small><div id="statProfit">₹0</div></div>
  </div>

  <!-- Main Navigation Grid Cards -->
  <div class="grid" id="proliv-section-navigation">
    <div class="card" onclick="openSection('patients-box')">
      <div class="card-icon">👥</div>
      <div class="card-label">Patients List</div>
      <div class="pill-badge" id="navPatientBadge">0</div>
    </div>
    <div class="card" onclick="openSection('schedules-box')">
      <div class="card-icon">📅</div>
      <div class="card-label">Schedules</div>
      <div class="pill-badge dark" id="navScheduleBadge">0</div>
    </div>
    <div class="card" onclick="openSection('fees-box')">
      <div class="card-icon">💰</div>
      <div class="card-label">Accounts</div>
      <div class="pill-badge green">P&L</div>
    </div>
  </div>

  <!-- 1. Patients Section -->
  <section id="patients-box" class="section-box">
    <button type="button" class="section-home-btn" onclick="goHome()">← Home</button>
    <div class="section-header">
      <span>PATIENTS LIST (Compact View)</span>
    </div>
    <button class="proliv-btn" style="margin-bottom: 10px; padding: 6px 10px;" onclick="openAddPatientModal()">+ Add New Patient</button>
    <div id="patient-list-container"></div>
  </section>

  <!-- 2. Schedules Section -->
  <section id="schedules-box" class="section-box">
    <button type="button" class="section-home-btn" onclick="goHome()">← Home</button>
    <div class="section-header">
      <span>SCHEDULES & REHAB</span>
    </div>
    <button class="proliv-btn" style="margin-bottom: 10px; padding: 6px 10px;" onclick="openAddScheduleModal()">+ Add Schedule</button>
    <div id="schedules-list"></div>
  </section>

  <!-- 3. Fees & P&L Section -->
  <section id="fees-box" class="section-box">
    <button type="button" class="section-home-btn" onclick="goHome()">← Home</button>
    <div class="section-header">
      <span>P&L Report</span>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <button class="proliv-btn proliv-btn-green" style="flex:1; padding:6px;" onclick="openAddTransactionModal()">+ Income</button>
      <button class="proliv-btn proliv-btn-secondary" style="flex:1; padding:6px;" onclick="openAddExpenseModal()">+ Expense</button>
    </div>
    <div id="fees-list"></div>
  </section>
</div>

<!-- Modals Container -->
<div id="proliv-dynamic-modals">
  <!-- Patient Filter Modal -->
  <div id="patientFilterModal" class="proliv-modal">
    <div class="proliv-modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 id="filterModalTitle" style="margin:0; font-size:15px;">Patient List</h3>
        <button class="proliv-btn proliv-btn-secondary" style="padding:2px 8px; font-size:12px;" onclick="closeModals()">✕</button>
      </div>
      <div id="filteredPatientList"></div>
    </div>
  </div>

  <!-- Patient Modal -->
  <div id="patientModal" class="proliv-modal">
    <div class="proliv-modal-content">
      <h3 id="patientModalTitle" style="margin-top:0; font-size:15px;">Patient Details</h3>
      <form id="patientForm">
        <input type="hidden" id="pId">
        <div class="proliv-form-group">
          <label>Patient Name *</label>
          <input type="text" id="pName" required>
        </div>
        <div class="flex-row">
          <div class="proliv-form-group">
            <label>Phone</label>
            <input type="tel" id="pPhone">
          </div>
          <div class="proliv-form-group">
            <label>Doctor Name</label>
            <input type="text" id="pDoctor" placeholder="Dr. Name">
          </div>
        </div>
        <div class="flex-row">
          <div class="proliv-form-group">
            <label>Time Slot</label>
            <input type="time" id="pTime">
          </div>
          <div class="proliv-form-group">
            <label>Place</label>
            <input type="text" id="pPlace">
          </div>
        </div>
        <div class="flex-row">
          <div class="proliv-form-group">
            <label>Total Fee (₹)</label>
            <input type="number" id="pFee" value="0">
          </div>
          <div class="proliv-form-group">
            <label>Paid (₹)</label>
            <input type="number" id="pPaid" value="0">
          </div>
        </div>
        <div class="flex-row">
          <div class="proliv-form-group">
            <label>Status</label>
            <select id="pStatus">
              <option value="Live">Live</option>
              <option value="Discharged">Discharged</option>
            </select>
          </div>
          <div class="proliv-form-group">
            <label>Start Date</label>
            <input type="date" id="pStartDate">
          </div>
        </div>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button type="submit" class="proliv-btn" style="flex:1;">Save</button>
          <button type="button" class="proliv-btn proliv-btn-secondary" onclick="closeModals()" style="flex:1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Schedule Modal -->
  <div id="scheduleModal" class="proliv-modal">
    <div class="proliv-modal-content">
      <h3 id="scheduleModalTitle" style="margin-top:0; font-size:15px;">Schedule & Rehab</h3>
      <form id="scheduleForm">
        <input type="hidden" id="sId">
        <div class="proliv-form-group">
          <label>Patient Name *</label>
          <input type="text" id="sName" required>
        </div>
        <div class="flex-row">
          <div class="proliv-form-group">
            <label>Date</label>
            <input type="date" id="sDate">
          </div>
          <div class="proliv-form-group">
            <label>Time</label>
            <input type="time" id="sTime">
          </div>
        </div>
        <div class="proliv-form-group">
          <label>Rehab Notes</label>
          <textarea id="sNotes" rows="2"></textarea>
        </div>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button type="submit" class="proliv-btn" style="flex:1;">Save</button>
          <button type="button" class="proliv-btn proliv-btn-secondary" onclick="closeModals()" style="flex:1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Expense Modal -->
  <div id="expenseModal" class="proliv-modal">
    <div class="proliv-modal-content">
      <h3 style="margin-top:0; font-size:15px;">Add Clinic Expense</h3>
      <form id="expenseForm">
        <div class="proliv-form-group">
          <label>Title *</label>
          <input type="text" id="eTitle" required>
        </div>
        <div class="proliv-form-group">
          <label>Amount (₹) *</label>
          <input type="number" id="eAmount" required>
        </div>
        <div class="proliv-form-group">
          <label>Date</label>
          <input type="date" id="eDate">
        </div>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button type="submit" class="proliv-btn" style="flex:1;">Add</button>
          <button type="button" class="proliv-btn proliv-btn-secondary" onclick="closeModals()" style="flex:1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Income Modal -->
  <div id="transactionModal" class="proliv-modal">
    <div class="proliv-modal-content">
      <h3 style="margin-top:0; font-size:15px;">Add Income</h3>
      <form id="transactionForm">
        <div class="proliv-form-group">
          <label>Source *</label>
          <input type="text" id="tTitle" required>
        </div>
        <div class="proliv-form-group">
          <label>Amount (₹) *</label>
          <input type="number" id="tAmount" required>
        </div>
        <div class="proliv-form-group">
          <label>Date</label>
          <input type="date" id="tDate">
        </div>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button type="submit" class="proliv-btn proliv-btn-green" style="flex:1;">Add</button>
          <button type="button" class="proliv-btn proliv-btn-secondary" onclick="closeModals()" style="flex:1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  let patients = JSON.parse(localStorage.getItem('proliv_patients')) || [];
  let schedules = JSON.parse(localStorage.getItem('proliv_schedules')) || [];
  let expenses = JSON.parse(localStorage.getItem('proliv_expenses')) || [];
  let transactions = JSON.parse(localStorage.getItem('proliv_transactions')) || [];

  function saveData() {
    localStorage.setItem('proliv_patients', JSON.stringify(patients));
    localStorage.setItem('proliv_schedules', JSON.stringify(schedules));
    localStorage.setItem('proliv_expenses', JSON.stringify(expenses));
    localStorage.setItem('proliv_transactions', JSON.stringify(transactions));
    renderAllData();
  }

  function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  function exportBackup() {
    const backupData = { patients, schedules, expenses, transactions, version: "1.0", date: new Date().toISOString() };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "proliv_physio_backup_" + new Date().toISOString().split('T')[0] + ".json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function importBackup(event) {
    const fileReader = new FileReader();
    if(event.target.files[0]) {
      fileReader.readAsText(event.target.files[0], "UTF-8");
      fileReader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if(parsed.patients || parsed.expenses) {
            if(confirm("സ്ഥിരീകരിക്കുക: നിലവിലുള്ള ഡാറ്റ റീപ്ലേസ് ചെയ്യപ്പെടും.")) {
              patients = parsed.patients || [];
              schedules = parsed.schedules || [];
              expenses = parsed.expenses || [];
              transactions = parsed.transactions || [];
              saveData();
              alert("റീസ്റ്റോർ ചെയ്തു!");
            }
          } else {
            alert("തെറ്റായ ഫയൽ!");
          }
        } catch(err) {
          alert("പരാജയപ്പെട്ടു: " + err);
        }
      };
    }
  }

  document.getElementById("patientForm").onsubmit = function(e) {
    e.preventDefault();
    const id = document.getElementById("pId").value;
    const patientData = {
      id: id ? id : 'p_' + Date.now(),
      name: document.getElementById("pName").value,
      phone: document.getElementById("pPhone").value,
      doctor: document.getElementById("pDoctor").value,
      time: document.getElementById("pTime").value,
      place: document.getElementById("pPlace").value,
      fee: parseFloat(document.getElementById("pFee").value) || 0,
      paid: parseFloat(document.getElementById("pPaid").value) || 0,
      status: document.getElementById("pStatus").value,
      startDate: document.getElementById("pStartDate").value
    };
    const todayStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    if (!id) {
      patients.push(patientData);
      if(patientData.paid > 0) {
        transactions.push({ id: 't_' + Date.now(), title: patientData.name, amount: patientData.paid, date: todayStr, type: 'income' });
      }
    } else {
      const index = patients.findIndex(item => item.id === id);
      if(index !== -1) patients[index] = patientData;
    }
    saveData();
    closeModals();
  };

  document.getElementById("scheduleForm").onsubmit = function(e) {
    e.preventDefault();
    const id = document.getElementById("sId").value;
    const scheduleData = {
      id: id ? id : 's_' + Date.now(),
      name: document.getElementById("sName").value,
      date: document.getElementById("sDate").value,
      time: document.getElementById("sTime").value,
      notes: document.getElementById("sNotes").value
    };
    if (!id) schedules.push(scheduleData);
    else {
      const index = schedules.findIndex(item => item.id === id);
      if(index !== -1) schedules[index] = scheduleData;
    }
    saveData();
    closeModals();
  };

  document.getElementById("expenseForm").onsubmit = function(e) {
    e.preventDefault();
    const dateVal = document.getElementById("eDate").value;
    const formattedDate = dateVal ? new Date(dateVal).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    expenses.push({ id: 'ex_' + Date.now(), title: document.getElementById("eTitle").value, amount: parseFloat(document.getElementById("eAmount").value) || 0, date: formattedDate });
    saveData();
    closeModals();
  };

  document.getElementById("transactionForm").onsubmit = function(e) {
    e.preventDefault();
    const dateVal = document.getElementById("tDate").value;
    const formattedDate = dateVal ? new Date(dateVal).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    transactions.push({ id: 't_' + Date.now(), title: document.getElementById("tTitle").value, amount: parseFloat(document.getElementById("tAmount").value) || 0, type: 'income', date: formattedDate });
    saveData();
    closeModals();
  };

  function openPatientFilterModal(type) {
    const titleEl = document.getElementById("filterModalTitle");
    const listEl = document.getElementById("filteredPatientList");
    let filtered = patients;
    if(type === 'Live') {
      titleEl.textContent = "Live Patients";
      filtered = patients.filter(p => (p.status || 'Live') === 'Live');
    } else if(type === 'Discharged') {
      titleEl.textContent = "Discharged Patients";
      filtered = patients.filter(p => p.status === 'Discharged');
    } else {
      titleEl.textContent = "All Patients";
    }

    listEl.innerHTML = filtered.length === 0 ? "<p style='color:#777; text-align:center;'>No patients.</p>" : "";
    filtered.forEach((p) => {
      let docText = p.doctor ? ` | 🩺 Dr: ${escapeHTML(p.doctor)}` : '';
      let timeText = p.time ? ` | ⏰ ${escapeHTML(p.time)}` : '';
      listEl.innerHTML += `
        <div class="card-item">
          <div style="flex:1; cursor:pointer;" onclick="closeModals(); editPatient('${p.id}');">
            <strong>${escapeHTML(p.name)}</strong> <small style="color:#aaa;">${timeText}${docText}</small>
          </div>
          <div>
            <button class="proliv-btn" style="padding:4px 8px; font-size:11px;" onclick="closeModals(); editPatient('${p.id}');">Edit</button>
          </div>
        </div>
      `;
    });
    document.getElementById("patientFilterModal").style.display = "flex";
  }

  function openAddPatientModal() {
    document.getElementById("patientModalTitle").textContent = "Add Patient";
    document.getElementById("pId").value = "";
    document.getElementById("pName").value = "";
    document.getElementById("pPhone").value = "";
    document.getElementById("pDoctor").value = "";
    document.getElementById("pTime").value = "";
    document.getElementById("pPlace").value = "";
    document.getElementById("pFee").value = "0";
    document.getElementById("pPaid").value = "0";
    document.getElementById("pStatus").value = "Live";
    document.getElementById("pStartDate").value = new Date().toISOString().split('T')[0];
    document.getElementById("patientModal").style.display = "flex";
  }

  function editPatient(id) {
    const p = patients.find(item => item.id === id);
    if(!p) return;
    document.getElementById("patientModalTitle").textContent = "Edit Patient";
    document.getElementById("pId").value = p.id;
    document.getElementById("pName").value = p.name || "";
    document.getElementById("pPhone").value = p.phone || "";
    document.getElementById("pDoctor").value = p.doctor || "";
    document.getElementById("pTime").value = p.time || "";
    document.getElementById("pPlace").value = p.place || "";
    document.getElementById("pFee").value = p.fee !== undefined ? p.fee : 0;
    document.getElementById("pPaid").value = p.paid !== undefined ? p.paid : 0;
    document.getElementById("pStatus").value = p.status || "Live";
    document.getElementById("pStartDate").value = p.startDate || "";
    document.getElementById("patientModal").style.display = "flex";
  }

  function deletePatient(id) {
    if (confirm("Delete?")) {
      patients = patients.filter(item => item.id !== id);
      saveData();
    }
  }

  function openAddScheduleModal() {
    document.getElementById("scheduleModalTitle").textContent = "Add Schedule";
    document.getElementById("sId").value = "";
    document.getElementById("sName").value = "";
    document.getElementById("sDate").value = "";
    document.getElementById("sTime").value = "";
    document.getElementById("sNotes").value = "";
    document.getElementById("scheduleModal").style.display = "flex";
  }

  function editSchedule(id) {
    const s = schedules.find(item => item.id === id);
    if(!s) return;
    document.getElementById("scheduleModalTitle").textContent = "Edit Schedule";
    document.getElementById("sId").value = s.id;
    document.getElementById("sName").value = s.name || "";
    document.getElementById("sDate").value = s.date || "";
    document.getElementById("sTime").value = s.time || "";
    document.getElementById("sNotes").value = s.notes || "";
    document.getElementById("scheduleModal").style.display = "flex";
  }

  function deleteSchedule(id) {
    if (confirm("Delete?")) {
      schedules = schedules.filter(item => item.id !== id);
      saveData();
    }
  }

  function openAddExpenseModal() {
    document.getElementById("eTitle").value = "";
    document.getElementById("eAmount").value = "";
    document.getElementById("eDate").value = new Date().toISOString().split('T')[0];
    document.getElementById("expenseModal").style.display = "flex";
  }

  function openAddTransactionModal() {
    document.getElementById("tTitle").value = "";
    document.getElementById("tAmount").value = "";
    document.getElementById("tDate").value = new Date().toISOString().split('T')[0];
    document.getElementById("transactionModal").style.display = "flex";
  }

  function deleteExpense(id) { expenses = expenses.filter(item => item.id !== id); saveData(); }
  function deleteTransaction(id) { transactions = transactions.filter(item => item.id !== id); saveData(); }

  function closeModals() {
    document.querySelectorAll('.proliv-modal').forEach(m => m.style.display = "none");
  }

  function switchPnlTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    if(tabName === 'collection') {
      document.getElementById('colTabBtn').classList.add('active');
      document.getElementById('collectionTabContent').classList.add('active');
    } else {
      document.getElementById('expTabBtn').classList.add('active');
      document.getElementById('expenseTabContent').classList.add('active');
    }
  }

  function getFinancials() {
    let totalCollection = transactions.reduce((sum, t) => sum + (t.amount || 0), 0);
    let totalExpense = expenses.reduce((sum, e) => sum + (e.amount || 0), 0);
    let netProfit = totalCollection - totalExpense;
    return { totalCollection, totalExpense, netProfit };
  }

  function renderAllData() {
    const pContainer = document.getElementById("patient-list-container");
    pContainer.innerHTML = patients.length === 0 ? "<p style='color:#777; font-size:12px;'>No patients added yet.</p>" : "";
    patients.forEach((p) => {
      let paidVal = p.paid !== undefined ? p.paid : 0;
      let timeStr = p.time ? `⏰ ${escapeHTML(p.time)}` : '';
      let docStr = p.doctor ? `🩺 ${escapeHTML(p.doctor)}` : '';
      
      pContainer.innerHTML += `
        <div class="card-item">
          <div style="flex:1; cursor:pointer;" onclick="editPatient('${p.id}')">
            <strong>${escapeHTML(p.name)}</strong> 
            <small style="color:#aaa;">(${escapeHTML(p.status || 'Live')})</small><br>
            <small style="color:#4caf50;">${timeStr} ${docStr ? '| ' + docStr : ''} | Paid: ₹${paidVal}</small>
          </div>
          <div style="display:flex; gap:4px;">
            <button class="proliv-btn" style="padding:4px 8px; font-size:11px;" onclick="editPatient('${p.id}')">Edit</button>
            <button class="proliv-btn proliv-btn-danger" onclick="deletePatient('${p.id}')">Del</button>
          </div>
        </div>
      `;
    });

    const sContainer = document.getElementById("schedules-list");
    sContainer.innerHTML = schedules.length === 0 ? "<p style='color:#777; font-size:12px;'>No schedules.</p>" : "";
    schedules.forEach((s) => {
      sContainer.innerHTML += `
        <div class="card-item">
          <div style="flex:1; cursor:pointer;" onclick="editSchedule('${s.id}')">
            <strong>${escapeHTML(s.name)}</strong><br>
            <small style="color:#aaa;">📅 ${escapeHTML(s.date || '')} ⏰ ${escapeHTML(s.time || '')} - ${escapeHTML(s.notes || '')}</small>
          </div>
          <div style="display:flex; gap:4px;">
            <button class="proliv-btn" style="padding:4px 8px; font-size:11px;" onclick="editSchedule('${s.id}')">Edit</button>
            <button class="proliv-btn proliv-btn-danger" onclick="deleteSchedule('${s.id}')">Del</button>
          </div>
        </div>
      `;
    });

    const fContainer = document.getElementById("fees-list");
    const fin = getFinancials();

    fContainer.innerHTML = `
      <div class="pnl-summary-box">
        <div>Net Profit: <b>₹${fin.netProfit}</b></div>
        <div style="color: var(--text-muted); margin-top:2px;">Collection: <span style="color:var(--accent-green);">${fin.totalCollection}</span> | Expense: <span style="color:var(--accent-red);">${fin.totalExpense}</span></div>
      </div>
      <div class="tab-container">
        <button id="colTabBtn" class="tab-btn active" onclick="switchPnlTab('collection')">Collection</button>
        <button id="expTabBtn" class="tab-btn" onclick="switchPnlTab('expense')">Expense</button>
      </div>
      <div id="collectionTabContent" class="tab-content active">
        ${transactions.length === 0 ? "<p style='color:#777; text-align:center; font-size:12px;'>No records.</p>" : ""}
        ${transactions.map((t) => `
          <div class="pnl-row">
            <span>${escapeHTML(t.date || '')} - <b>${escapeHTML(t.title || '')}</b></span>
            <div style="display:flex; align-items:center; gap:6px;">
              <span style="color:var(--accent-green); font-weight:bold;">₹${t.amount}</span>
              <button class="proliv-btn proliv-btn-danger" onclick="deleteTransaction('${t.id}')">X</button>
            </div>
          </div>
        `).join('')}
      </div>
      <div id="expenseTabContent" class="tab-content">
        ${expenses.length === 0 ? "<p style='color:#777; text-align:center; font-size:12px;'>No records.</p>" : ""}
        ${expenses.map((e) => `
          <div class="pnl-row">
            <span>${escapeHTML(e.date || '')} - <b>${escapeHTML(e.title || '')}</b></span>
            <div style="display:flex; align-items:center; gap:6px;">
              <span style="color:var(--accent-red); font-weight:bold;">₹${e.amount}</span>
              <button class="proliv-btn proliv-btn-danger" onclick="deleteExpense('${e.id}')">X</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;

    updateDashboardStats();
  }

  function updateDashboardStats() {
    document.getElementById("statLive").textContent = patients.filter(p => (p.status || 'Live') === "Live").length;
    document.getElementById("statTotal").textContent = patients.length;
    document.getElementById("statDischarged").textContent = patients.filter(p => p.status === "Discharged").length;
    document.getElementById("statSchedules").textContent = schedules.length;
    let fin = getFinancials();
    document.getElementById("statCollection").textContent = "₹" + fin.totalCollection;
    document.getElementById("statProfit").textContent = "₹" + fin.netProfit;
    document.getElementById("navPatientBadge").textContent = patients.length;
    document.getElementById("navScheduleBadge").textContent = schedules.length;
  }

  function openSection(sectionId) {
    document.querySelectorAll(".section-box").forEach(box => box.style.display = "none");
    document.getElementById("proliv-section-navigation").style.display = "none";
    document.querySelector(".stats-grid").style.display = "none";
    const selected = document.getElementById(sectionId);
    if (selected) selected.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function goHome() {
    document.querySelectorAll(".section-box").forEach(box => box.style.display = "none");
    document.getElementById("proliv-section-navigation").style.display = "grid";
    document.querySelector(".stats-grid").style.display = "grid";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  renderAllData();
</script>
</body>
</html>
