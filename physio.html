<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGM Physio - Advanced Management Dashboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-primary: #00e676;
            --accent-secondary: #29b6f6;
            --accent-warning: #ffa726;
            --accent-danger: #ef5350;
            --input-bg: #2d2d2d;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            padding-bottom: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-size: 1.3rem;
            letter-spacing: 0.5px;
        }

        .section-title {
            font-size: 1rem;
            color: var(--accent-secondary);
            margin: 15px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 3px solid var(--accent-secondary);
            padding-left: 8px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 90px;
        }

        .card:active {
            transform: scale(0.96);
            background-color: #2a2a2a;
        }

        .card-title {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .card-value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .c-green { color: var(--accent-primary); }
        .c-blue { color: var(--accent-secondary); }
        .c-orange { color: var(--accent-warning); }
        .c-red { color: var(--accent-danger); }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .modal-header {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--accent-primary);
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
