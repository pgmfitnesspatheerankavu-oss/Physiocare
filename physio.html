<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROLIV PHYSIO</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --red-accent: #d32f2f;
            --pill-bg-red: #5f1414;
            --pill-bg-dark: #000000;
            --accent-green: #00e676;
            --accent-orange: #ff9800;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 12px;
            padding-bottom: 90px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 16px 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ff5252, #d32f2f);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 0 10px rgba(211, 47, 47, 0.5);
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .top-icons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .top-icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* Section Title */
        .section-header {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin: 18px 4px 10px 4px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Horizontal Scrollable Filter Chips */
        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
            scrollbar-width: none;
        }

        .filter-chip {
            background: var(--card-bg);
            border: 1px solid #2a2a2c;
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.75rem;
            color: #ccc;
        }

        .filter-chip.active {
            background: #2a2a2c;
            border-color: var(--red-accent);
            color: #fff;
            font-weight: bold;
        }

        .chip-badge {
            background: #000;
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* 3-Column Square Box Grid */
        .grid-boxes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .box-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 105px;
            border: 1px solid #2a2a2c;
            cursor: pointer;
            position: relative;
        }

        .box-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #3a3a3c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #fff;
        }

        .box-title {
            font-size: 0.72rem;
            color: var(--text-main);
            font-weight: bold;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        .box-sub {
            font-size: 0.62rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .pill-badge {
            background-color: var(--pill-bg-red);
            color: #ff8a80;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .pill-badge.green {
            background-color: #0d381e;
            color: #00e676;
        }

        /* Floating Action Button (FAB) */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--red-accent);
            color: #ffffff;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(213, 47, 47, 0.5);
            cursor: pointer;
            border: none;
            z-index: 99;
        }

        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            border-top: 1px solid #3a3a3c;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            color: #fff;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .btn-full {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-save { background: var(--red-accent); color: #fff; }
        .btn-cancel { background: #3a3a3c; color: #fff; }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2c2c2e;
            font-size: 0.85rem;
        }
        .detail-label { color: var(--text-sub); }
        .detail-val { font-weight: bold; color: var(--text-main); }

        /* P&L Tabs */
        .pnl-tabs {
            display: flex;
            border-bottom: 1px solid #3a3a3c;
            margin-bottom: 12px;
        }
        .pnl-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text-sub);
        }
        .pnl-tab.active {
            color: #fff;
            font-weight: bold;
            border-bottom: 2px solid var(--red-accent);
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="brand">
            <div class="brand-logo">P</div>
            <div class="brand-title">PROLIV PHYSIO</div>
        </div>
        <div class="top-icons">
            <button class="top-icon-btn" onclick="openPatientModal()">👤+</button>
            <button class="top-icon-btn" onclick="openPnlModal()">📈</button>
        </div>
    </div>

    <!-- Dashboard Overview Grid -->
    <div class="grid-boxes">
        <div class="box-card" onclick="openPnlModal()">
            <div style="font-size:1.2rem;">💰</div>
            <div class="box-title">Total Collection</div>
            <div class="pill-badge green" id="dash-collection">₹0</div>
        </div>
        <div class="box-card" onclick="openPnlModal()">
            <div style="font-size:1.2rem;">💸</div>
            <div class="box-title">Total Expense</div>
            <div class="pill-badge" id="dash-expense">₹0</div>
        </div>
        <div class="box-card" onclick="openPnlModal()">
            <div style="font-size:1.2rem;">👛</div>
            <div class="box-title">Due Amount</div>
            <div class="pill-badge" id="dash-due">₹0</div>
        </div>
    </div>

    <!-- Patient Filter Chips -->
    <div class="filter-chips">
        <div class="filter-chip active" onclick="filterCategory('All', this)">All <span class="chip-badge" id="cnt-all">0</span></div>
        <div class="filter-chip" onclick="filterCategory('Active', this)">Active <span class="chip-badge" id="cnt-active">0</span></div>
        <div class="filter-chip" onclick="filterCategory('Rehab', this)">Rehab <span class="chip-badge" id="cnt-rehab">0</span></div>
        <div class="filter-chip" onclick="filterCategory('Discharged', this)">Discharged <span class="chip-badge" id="cnt-discharged">0</span></div>
    </div>

    <!-- PATIENTS LIST (Box Grid Type) -->
    <div class="section-header">
        <span>PATIENT BOXES</span>
        <button style="background:#3a3a3c; color:#fff; border:none; padding:4px 8px; border-radius:6px; font-size:0.75rem;" onclick="openPatientModal()">+ Add</button>
    </div>
    <div class="grid-boxes" id="patient-boxes"></div>

    <!-- P&L / REVENUE BOXES (Box Grid Type) -->
    <div class="section-header">
        <span>P&L TRANSACTIONS</span>
        <button style="background:#3a3a3c; color:#fff; border:none; padding:4px 8px; border-radius:6px; font-size:0.75rem;" onclick="openFeeModal()">+ Entry</button>
    </div>
    <div class="grid-boxes" id="pnl-boxes"></div>

    <!-- Floating Action Button -->
    <button class="fab" onclick="openPatientModal()">+</button>

    <!-- Modal Popup -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">Edit Details</div>
            <div id="modal-body"></div>
            <div class="modal-actions" id="modal-actions">
                <button class="btn-full btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-full btn-save" onclick="saveData()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let patients = JSON.parse(localStorage.getItem('proliv_patients')) || [
            { name: "Shyamjith", phone: "9496342522", plan: "Couple Pack", finalAmt: 3500, paid: 3500, due: 0, startDate: "Oct 27, 2026", endDate: "Jan 24, 2027", status: "Active" },
            { name: "Fathima hannath", phone: "6282944060", plan: "Basic Pack", finalAmt: 2000, paid: 2000, due: 0, startDate: "Oct 27, 2026", endDate: "Nov 25, 2026", status: "Active" }
        ];

        let transactions = JSON.parse(localStorage.getItem('proliv_transactions')) || [
            { name: "Fathima hannath", type: "Income", amount: 2000, date: "Oct 27, 2026" },
            { name: "Shifana", type: "Income", amount: 8000, date: "Oct 27, 2026" },
            { name: "Rajesh Rajan", type: "Income", amount: 3500, date: "Oct 26, 2026" },
            { name: "Anusree PM", type: "Income", amount: 2000, date: "Oct 26, 2026" }
        ];

        let activeFilter = 'All';
        let currentType = '';
        let editIndex = -1;

        function updateUI() {
            let totalIncome = transactions.filter(t => t.type === 'Income').reduce((a, b) => a + Number(b.amount), 0);
            let totalExpense = transactions.filter(t => t.type === 'Expense').reduce((a, b) => a + Number(b.amount), 0);
            let totalDue = patients.reduce((a, b) => a + Number(b.due || 0), 0);

            document.getElementById('dash-collection').innerText = '₹' + totalIncome;
            document.getElementById('dash-expense').innerText = '₹' + totalExpense;
            document.getElementById('dash-due').innerText = '₹' + totalDue;

            document.getElementById('cnt-all').innerText = patients.length;
            document.getElementById('cnt-active').innerText = patients.filter(p => p.status === 'Active').length;
            document.getElementById('cnt-rehab').innerText = patients.filter(p => p.status === 'Rehab').length;
            document.getElementById('cnt-discharged').innerText = patients.filter(p => p.status === 'Discharged').length;

            // Render Patient Box Cards
            let pGrid = document.getElementById('patient-boxes');
            let filteredP = activeFilter === 'All' ? patients : patients.filter(p => p.status === activeFilter);
            pGrid.innerHTML = filteredP.length === 0 ? '<div style="grid-column: span 3; text-align:center; color:#666; font-size:0.8rem;">No Records</div>' :
                filteredP.map((p, i) => `
                <div class="box-card" onclick="viewPatientCard(${i})">
                    <div class="box-avatar">${p.name.charAt(0)}</div>
                    <div class="box-title">${p.name}</div>
                    <div class="box-sub">${p.plan || 'Therapy'}</div>
                    <div class="pill-badge ${p.due > 0 ? '' : 'green'}">${p.due > 0 ? 'Due: ₹'+p.due : 'Paid'}</div>
                </div>`).join('');

            // Render P&L Box Cards
            let txGrid = document.getElementById('pnl-boxes');
            txGrid.innerHTML = transactions.length === 0 ? '<div style="grid-column: span 3; text-align:center; color:#666; font-size:0.8rem;">No Transactions</div>' :
                transactions.slice(0, 6).map((t, i) => `
                <div class="box-card" onclick="openPnlModal()">
                    <div style="font-size:1.1rem;">${t.type === 'Income' ? '💵' : '🧾'}</div>
                    <div class="box-title">${t.name}</div>
                    <div class="box-sub">${t.date || 'Oct 29'}</div>
                    <div class="pill-badge ${t.type === 'Income' ? 'green' : ''}">₹${t.amount}</div>
                </div>`).join('');

            localStorage.setItem('proliv_patients', JSON.stringify(patients));
            localStorage.setItem('proliv_transactions', JSON.stringify(transactions));
        }

        function filterCategory(cat, el) {
            activeFilter = cat;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            updateUI();
        }

        /* Full Details View Modal for Patient */
        function viewPatientCard(index) {
            let p = patients[index];
            document.getElementById('modal-title').innerText = p.name;
            document.getElementById('modal-body').innerHTML = `
                <div class="detail-row"><span class="detail-label">Contact:</span><span class="detail-val">${p.phone || 'N/A'}</span></div>
                <div class="detail-row"><span class="detail-label">Plan/Treatment:</span><span class="detail-val">${p.plan || 'N/A'}</span></div>
                <div class="detail-row"><span class="detail-label">Final Amount:</span><span class="detail-val">₹${p.finalAmt || 0}</span></div>
                <div class="detail-row"><span class="detail-label">Paid Amount:</span><span class="detail-val" style="color:#00e676">₹${p.paid || 0}</span></div>
                <div class="detail-row"><span class="detail-label">Pending Due:</span><span class="detail-val" style="color:#ef5350">₹${p.due || 0}</span></div>
                <div class="detail-row"><span class="detail-label">Join Date:</span><span class="detail-val">${p.startDate || 'N/A'}</span></div>
                <div class="detail-row"><span class="detail-label">End Date:</span><span class="detail-val">${p.endDate || 'N/A'}</span></div>
            `;
            document.getElementById('modal-actions').innerHTML = `
                <button class="btn-full btn-cancel" onclick="closeModal()">Close</button>
                <button class="btn-full btn-save" onclick="openPatientModal(${index})">Edit Details</button>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        /* P&L Report Screen Modal */
        function openPnlModal() {
            let totalInc = transactions.filter(t => t.type === 'Income').reduce((a, b) => a + Number(b.amount), 0);
            let totalExp = transactions.filter(t => t.type === 'Expense').reduce((a, b) => a + Number(b.amount), 0);
            let netProfit = totalInc - totalExp;

            document.getElementById('modal-title').innerText = "P&L Report";
            document.getElementById('modal-body').innerHTML = `
                <div style="text-align:center; margin-bottom:12px;">
                    <div style="font-size:0.8rem; color:#aaa;">Net Profit: <b style="color:#fff;">₹${netProfit}</b> Total</div>
                    <div style="font-size:0.75rem; color:#888; margin-top:2px;">Collection: ${totalInc} | Expense: ${totalExp}</div>
                </div>
                <div class="pnl-tabs">
                    <div class="pnl-tab active">Collection</div>
                </div>
                ${transactions.map(t => `
                    <div class="detail-row">
                        <span style="color:#888;">${t.date || 'Oct 28, 2026'}</span>
                        <span style="font-weight:bold;">${t.name}</span>
                        <span style="color:${t.type === 'Income' ? '#00e676' : '#ef5350'}">${t.amount}</span>
                    </div>
                `).join('')}
            `;
            document.getElementById('modal-actions').innerHTML = `<button class="btn-full btn-cancel" onclick="closeModal()">Close</button>`;
            document.getElementById('modal').style.display = 'flex';
        }

        /* Forms */
        function openPatientModal(index = -1) {
            currentType = 'patient';
            editIndex = index;
            let data = index >= 0 ? patients[index] : { name: '', phone: '', plan: '', finalAmt: '', paid: '', due: '', status: 'Active' };

            document.getElementById('modal-title').innerText = index >= 0 ? 'Edit Patient' : 'Add New Patient';
            document.getElementById('modal-body').innerHTML = `
                <div class="form-group"><label>Patient Name</label><input id="p_name" value="${data.name}"></div>
                <div class="form-group"><label>Contact Number</label><input id="p_phone" value="${data.phone}"></div>
                <div class="form-group"><label>Plan / Condition</label><input id="p_plan" value="${data.plan}"></div>
                <div class="form-group"><label>Final Amount (₹)</label><input type="number" id="p_amt" value="${data.finalAmt}"></div>
                <div class="form-group"><label>Paid Amount (₹)</label><input type="number" id="p_paid" value="${data.paid}"></div>
                <div class="form-group"><label>Due Amount (₹)</label><input type="number" id="p_due" value="${data.due}"></div>
            `;
            document.getElementById('modal-actions').innerHTML = `
                <button class="btn-full btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-full btn-save" onclick="saveData()">Save</button>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        function openFeeModal() {
            currentType = 'fee';
            document.getElementById('modal-title').innerText = 'Add Transaction';
            document.getElementById('modal-body').innerHTML = `
                <div class="form-group"><label>Patient Name / Expense Title</label><input id="f_name"></div>
                <div class="form-group"><label>Type</label>
                    <select id="f_type">
                        <option value="Income">Collection (Income)</option>
                        <option value="Expense">Clinic Expense</option>
                    </select>
                </div>
                <div class="form-group"><label>Amount (₹)</label><input type="number" id="f_amt"></div>
            `;
            document.getElementById('modal-actions').innerHTML = `
                <button class="btn-full btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-full btn-save" onclick="saveData()">Save</button>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function saveData() {
            if (currentType === 'patient') {
                let obj = {
                    name: document.getElementById('p_name').value,
                    phone: document.getElementById('p_phone').value,
                    plan: document.getElementById('p_plan').value,
                    finalAmt: Number(document.getElementById('p_amt').value),
                    paid: Number(document.getElementById('p_paid').value),
                    due: Number(document.getElementById('p_due').value),
                    startDate: "Oct 29, 2026",
                    status: "Active"
                };
                if (editIndex >= 0) patients[editIndex] = obj; else patients.push(obj);
            } else if (currentType === 'fee') {
                let obj = {
                    name: document.getElementById('f_name').value,
                    type: document.getElementById('f_type').value,
                    amount: Number(document.getElementById('f_amt').value),
                    date: "Oct 29, 2026"
                };
                transactions.unshift(obj);
            }
            closeModal();
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
