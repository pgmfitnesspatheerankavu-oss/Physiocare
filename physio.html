<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROLIV PHYSIO</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --red-accent: #d32f2f;
            --pill-bg-red: #5f1414;
            --pill-bg-dark: #000000;
            --accent-green: #00e676;
            --accent-orange: #ff9800;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 12px;
            padding-bottom: 90px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 16px 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ff5252, #d32f2f);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 0 10px rgba(211, 47, 47, 0.5);
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .top-icons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .top-icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* Dashboard Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 14px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 105px;
            border: 1px solid #2a2a2c;
            cursor: pointer;
        }

        .card-icon {
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .card-label {
            font-size: 0.68rem;
            color: #d1d1d6;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 8px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pill-badge {
            background-color: var(--pill-bg-red);
            color: #ff8a80;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 3px 12px;
            border-radius: 12px;
            min-width: 45px;
        }

        .pill-badge.dark {
            background-color: var(--pill-bg-dark);
            color: var(--text-main);
            border: 1px solid #3a3a3c;
        }

        /* Section Lists */
        .section-header {
            font-size: 0.9rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin: 20px 4px 10px 4px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
